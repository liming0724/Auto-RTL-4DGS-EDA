name: RTL baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys
          mkdir -p "$RUNNER_TEMP/sv2v"
          cd "$RUNNER_TEMP/sv2v"
          curl -fsSLo sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.12/sv2v-Linux.zip
          echo 'ff8c9eea5bc029b372fb4953427625cddb7cf7e58c1240623ac9f260818d5a00  sv2v.zip' | sha256sum -c -
          unzip -q sv2v.zip
          echo "$RUNNER_TEMP/sv2v/sv2v-Linux" >> "$GITHUB_PATH"
      - name: Lint, simulate, synthesize, and prove equivalence
        run: make -j2 cec_baseline
