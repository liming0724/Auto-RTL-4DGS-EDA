name: RTL baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys
          mkdir -p "$RUNNER_TEMP/sv2v"
          cd "$RUNNER_TEMP/sv2v"
          curl -fsSLo sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.12/sv2v-Linux.zip
          echo 'ff8c9eea5bc029b372fb4953427625cddb7cf7e58c1240623ac9f260818d5a00  sv2v.zip' | sha256sum -c -
          unzip -q sv2v.zip
          echo "$RUNNER_TEMP/sv2v/sv2v-Linux" >> "$GITHUB_PATH"
      - name: Install formal Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install z3-solver==5.4.1.0 pybind11==2.13.6
      - name: Lint, simulate, synthesize, and prove equivalence
        run: make -j2 cec_baseline
      - name: Z3 formal checks and CEGAR self-test
        run: make test_cegar PYTHON="$RUNNER_TEMP/venv/bin/python"
      - name: 4DGS lint and bit-true simulation
        run: make sim_4dgs PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=yosys-abc
      - name: 4DGS synthesis, equivalence, and formal checks
        run: make formal_4dgs PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=yosys-abc
      - name: 4DGS frame-level FP32 validation and SSIM_v2 scoring
        run: make sim_4dgs_frame PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=yosys-abc
      - name: 4DGS quality-vs-skip sweep
        run: make eval_quality_4dgs PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=yosys-abc
      - name: 4DGS bandwidth profiler (Modeled External DRAM Traffic)
        run: make profile_bw_4dgs PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=yosys-abc
      - name: 4DGS Phase 5b stress sweep (benign/pan/fast, 76 runs)
        run: make stress_4dgs PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=yosys-abc
      - name: 4DGS Phase 5b small-determinant conic characterization
        run: make conic_cliff_4dgs PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=yosys-abc

  # Phase 5c split-fetch AXI wrapper: own job to keep the baseline job under its 120-minute limit.
  # Tier 2 runs at the synth_4dgs configuration here; the NUM_PE=2, CACHE_WAYS=4, Q_FRAC=12 Tier 2
  # (about 2.5 h of ABC + CEC per design pair) is `make synth_4dgs_axi` with the default AXI_SYNTH.
  axi_split_fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys
          mkdir -p "$RUNNER_TEMP/sv2v"
          cd "$RUNNER_TEMP/sv2v"
          curl -fsSLo sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.12/sv2v-Linux.zip
          echo 'ff8c9eea5bc029b372fb4953427625cddb7cf7e58c1240623ac9f260818d5a00  sv2v.zip' | sha256sum -c -
          unzip -q sv2v.zip
          echo "$RUNNER_TEMP/sv2v/sv2v-Linux" >> "$GITHUB_PATH"
      - name: Install formal Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install z3-solver==5.4.1.0 pybind11==2.13.6
      - name: 4DGS Phase 5c split-fetch AXI wrapper simulation (MEASURED AXI beats)
        run: make sim_4dgs_axi PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=yosys-abc
      - name: 4DGS Phase 5c wrapper vs bare-top synthesis and equivalence (NUM_PE=1, CACHE_WAYS=2, Q_FRAC=8), then Z3 obligations
        run: make formal_4dgs_axi PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=yosys-abc AXI_SYNTH="--num-pe 1 --q-frac 8 --cache-ways 2"
