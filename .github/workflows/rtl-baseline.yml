name: RTL baseline

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install EDA tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator yosys
          mkdir -p "$RUNNER_TEMP/sv2v"
          cd "$RUNNER_TEMP/sv2v"
          curl -fsSLo sv2v.zip https://github.com/zachjs/sv2v/releases/download/v0.0.12/sv2v-Linux.zip
          echo 'ff8c9eea5bc029b372fb4953427625cddb7cf7e58c1240623ac9f260818d5a00  sv2v.zip' | sha256sum -c -
          unzip -q sv2v.zip
          echo "$RUNNER_TEMP/sv2v/sv2v-Linux" >> "$GITHUB_PATH"
      - name: Install formal Python dependencies
        run: |
          python3 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install z3-solver==5.4.1.0 pybind11==2.13.6
      - name: Lint, simulate, synthesize, and prove equivalence
        run: make -j2 cec_baseline
      - name: Z3 formal checks and CEGAR self-test
        run: make test_cegar PYTHON="$RUNNER_TEMP/venv/bin/python"
      - name: 4DGS lint and bit-true simulation
        run: make sim_4dgs PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=/usr/bin/berkeley-abc
      - name: 4DGS synthesis, equivalence, and formal checks
        run: make formal_4dgs PYTHON="$RUNNER_TEMP/venv/bin/python" ABC=/usr/bin/berkeley-abc
